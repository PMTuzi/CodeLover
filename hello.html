<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fff5f7 0%, #fdf0f5 60%, #fff5f7 100%);
      color: #5a3a4a;
    }

    .card {
      background: rgba(255, 245, 248, 0.95);
      border: 1px solid rgba(255, 160, 185, 0.4);
      border-radius: 20px;
      padding: 48px 56px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(255, 140, 170, 0.18);
      -webkit-app-region: drag;
    }

    h1 {
      font-size: 42px;
      font-weight: 700;
      color: #c03050;
      letter-spacing: 1px;
    }

    p {
      margin-top: 12px;
      font-size: 16px;
      color: rgba(192, 96, 120, 0.85);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello</h1>
    <p>你好，欢迎来到 CyberLover。</p>
  </main>
</body>
</html>
